<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285.91 64.21" width="285.91px" height="64.21px">
  <!-- Google 4-color "G" Logo (Left) -->
  <g id="google-logo" transform="translate(6, 7) scale(1.05)">
    <!-- Blue -->
    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
    <!-- Green -->
    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.66 14.62 48 24 48z"/>
    <!-- Yellow -->
    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.55 10.78l7.98-6.19z"/>
    <!-- Red -->
    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.34 2.55 13.21l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
  </g>

  <!-- Typography (Right) -->
  <g id="google-text" transform="translate(70, 0)">
    <!-- Brand Title "Google Educator" -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, sans-serif" font-size="26" font-weight="800" fill="#0f172a" letter-spacing="-0.4">Google Educator</text>
    
    <!-- Subtitle Badge: Level 1 & Level 2 -->
    <g transform="translate(0, 39)">
      <!-- Level 1 pill -->
      <rect x="0" y="0" width="62" height="18" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <text x="31" y="13" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Level 1</text>
      
      <!-- Ampersand -->
      <text x="70" y="13.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">&amp;</text>
      
      <!-- Level 2 pill -->
      <rect x="80" y="0" width="62" height="18" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
      <text x="111" y="13" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">Level 2</text>
    </g>
  </g>
</svg>
